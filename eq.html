<style>
/* Layout: one-screen field app — header, scrolling tab views, bottom icon nav, bottom sheet. Motif: plant-yard tags (yellow equipment plates on slate). */
:root{
  --bg:#eef0f2; --panel:#ffffff; --panel2:#f5f6f8; --ink:#17202a; --muted:#5c6773; --line:#d6dbe1;
  --brand:#1c2733; --brand2:#2c3e50; --brand-ink:#eef3f7; --accent:#f2b705; --accent-ink:#1d1600;
  --work:#2f9a62; --idle:#d6a01c; --down:#c8433a; --maint:#7a5cc4; --off:#8a939c; --move:#2f73c0;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(28,39,51,.06),0 6px 18px rgba(28,39,51,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --panel:#161e26; --panel2:#1b252f; --ink:#e5ebf0; --muted:#95a2ae; --line:#28333e;
  --brand:#0a1016; --brand2:#1a2836; --brand-ink:#dfe8ef; --accent:#f5c32c; --accent-ink:#1d1600;
  --work:#4cc483; --idle:#e9bb3f; --down:#ea6a5c; --maint:#a58be6; --off:#7d8892; --move:#5b9ee6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:#161e26; --panel2:#1b252f; --ink:#e5ebf0; --muted:#95a2ae; --line:#28333e;
  --brand:#0a1016; --brand2:#1a2836; --brand-ink:#dfe8ef; --accent:#f5c32c; --accent-ink:#1d1600;
  --work:#4cc483; --idle:#e9bb3f; --down:#ea6a5c; --maint:#a58be6; --off:#7d8892; --move:#5b9ee6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--brand-ink);padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:11px;flex:none;border-bottom:3px solid var(--accent)}
.logo{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--accent);background:var(--accent)}
h1{min-width:0;font-family:var(--display);font-size:22px;letter-spacing:.03em;margin:0;line-height:.95;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 small{font:600 10px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.75;display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.who{margin-left:auto;text-align:right;font-size:11px;flex:none}
.sync{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;opacity:.85}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--work);display:inline-block}
@media (max-width:520px){.sync span{display:none}}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:14px 28px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
nav{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow-x:auto}
nav button{flex:1;min-width:42px;background:none;border:0;color:var(--muted);font:600 9.5px var(--body);padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
h2{font-family:var(--display);font-size:20px;letter-spacing:.04em;margin:0;text-transform:uppercase;font-weight:700}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch small{color:var(--muted);font-size:11.5px}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ur{font-size:11.5px;color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;box-sizing:border-box}
textarea{width:100%;font-family:var(--mono);font-size:12px;min-height:100px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select{color:var(--ink);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.btn{font:700 13px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--down)}
.btn.sm{padding:7px 10px;font-size:12px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,nav button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.plate{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:26px;padding:0 6px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:800 13px var(--display);letter-spacing:.06em;border:1.5px solid rgba(0,0,0,.25);flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line))}
.kpi b{font-family:var(--display);font-size:30px;line-height:1;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
.hero{background:linear-gradient(160deg,var(--brand),var(--brand2));color:var(--brand-ink);border-radius:18px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:repeating-linear-gradient(45deg,var(--accent) 0 10px,transparent 10px 20px);opacity:.12}
.hn{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.hs{font-size:12px;opacity:.8;margin-top:4px}
.hk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;position:relative;z-index:1}
.hk b{display:block;font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.hk span{font-size:10.5px;opacity:.75}
.bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line)}
.bar span{display:block;height:100%}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:13.5px}
.li .t span{font-size:11.5px;color:var(--muted)}
.zone{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.zh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.zh b{font-family:var(--display);font-size:18px;letter-spacing:.03em}
.zh .cnt{margin-left:auto;font-size:11.5px;color:var(--muted)}
.mach{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.mach:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 11px;font:700 12px var(--body);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:700 12px var(--body);padding:7px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td input,td select{padding:6px 7px;font-size:12.5px}
td.num,th.num{text-align:right}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.28);max-height:88%;overflow:auto;z-index:20;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.confirm{background:var(--panel2);border:1px solid var(--down);border-radius:10px;padding:10px;margin-top:8px}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
@media (max-width:520px){.zc{display:none}}
.typebar{display:flex;align-items:center;gap:8px;margin-top:8px}
.typebar .lbl{width:110px;font-size:12px;font-weight:600;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typebar .bar{flex:1}
.typebar .n{width:28px;text-align:right;font-family:var(--mono);font-size:12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}}

  S.equip=L.map((r,i)=>({id:'e'+i,no:r[0],type:r[1],model:r[2],zone:S.meta.zones[r[3]],fore:'f'+r[4],status:r[5],operator:r[6],opSal:r[7],owner:i%4===3?'Rental':'Own',plate:'',meter:3000+i*137,notes:r[5]==='down'?'Hydraulic hose burst — waiting for part':'',upd:Date.now()}));

let logDate='';
function renderLog(){
  if(!logDate)logDate=today();
  if(logMode==='trips'){$('v-log').innerHTML=`<div class="stack" id="lHost"><div><h2 style="font-size:24px">Truck trips</h2><div class="small muted">Trips × capacity = m³ hauled</div></div>${segHtml('lSeg',[['hours','Hours'],['trips','Truck trips']],logMode)}</div>`;bindSeg('lSeg',k=>{logMode=k;renderLog()});renderTrips($('lHost'));return}
  const E=S.equip.filter(e=>e.status!=='off').sort((a,b)=>(a.zone||'').localeCompare(b.zone||'')||a.no.localeCompare(b.no,undefined,{numeric:true}));
  const L=logsOn(logDate),h=sumH(L);

  <div><h2 style="font-size:24px">Daily timesheet</h2><div class="small muted">Work, idle and breakdown hours for every machine</div></div>
  ${segHtml('lSeg',[['hours','Hours'],['trips','Truck trips']],logMode)}
  <div class="card"><div class="row"><label class="f grow">Date<input id="lD" type="date" value="${logDate}"></label><button class="btn sm" id="lPrev">Copy previous day</button><button class="btn sm" id="lFill">All 10 h work</button></div>

    <td><select data-k="act">${ACTS.map(a=>`<option${l.act===a?' selected':''}>${a}</option>`).join('')}</select></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No machines on site</td></tr>'}
  </tbody></table></div>

  $('lPrev').onclick=()=>{let d=dAdd(logDate,-1),P=[];for(let i=0;i<7&&!P.length;i++){P=logsOn(d);if(!P.length)d=dAdd(d,-1)}if(!P.length){toast('No earlier timesheet in the last 7 days');return}
    $('v-log').querySelectorAll('tr[data-e]').forEach(r=>{const p=P.find(x=>x.eq===r.dataset.e);if(!p)return;['work','idle','down'].forEach(k=>r.querySelector(`[data-k="${k}"]`).value=p[k]??'');r.querySelector('[data-k="act"]').value=p.act||ACTS[0]});toast('Copied from '+dNice(d)+' — check and save')};

let repDate='';
function repData(d){
  const L=logsOn(d),E=S.equip.filter(e=>e.status!=='off'||L.some(l=>l.eq===e.id));
  const rows=E.map(e=>{const l=L.find(x=>x.eq===e.id)||{};return{e,l,zone:l.zone||e.zone||'—'}}).sort((a,b)=>a.zone.localeCompare(b.zone)||a.e.no.localeCompare(b.e.no,undefined,{numeric:true}));
  const byType={};rows.forEach(r=>{const t=byType[r.e.type]=byType[r.e.type]||{n:0,w:0,h:0};t.n++;if(r.e.status==='work')t.w++;t.h+=+r.l.work||0});
  return{rows,byType,h:sumH(L),mv:S.moves.filter(m=>m.date===d)};
}
function repText(d){
  const r=repData(d);let z='';const lines=[];
  r.rows.forEach(x=>{if(x.zone!==z){z=x.zone;lines.push('','*'+z+'*')}lines.push(`- ${x.e.no} ${x.e.type}${x.e.operator?' / '+x.e.operator:''} — ${st(x.e.status)[0]}${x.l.work!=null?`, ${fmt1(x.l.work)} h work${x.l.down?`, ${fmt1(x.l.down)} h down`:''}`:''}`)});
  return `Daily Equipment Report — ${dNice(d)}
${M().company?M().company+'\n':''}
Summary: ${r.rows.length} machines · ${fmt1(r.h.w)} work h · ${fmt1(r.h.i)} idle h · ${fmt1(r.h.d)} down h · utilisation ${util(r.h).toFixed(0)}%
${Object.keys(r.byType).sort().map(t=>`${t}: ${r.byType[t].n} (${r.byType[t].w} working)`).join('\n')}
${lines.join('\n')}
${r.mv.length?'\nMovements:\n'+r.mv.map(m=>`- ${(eqById(m.eq)||{}).no||''}: ${m.from} → ${m.to}`).join('\n'):''}

${M().eng}
${M().role}`;
}

function repCSV(d){const r=repData(d);const q=x=>/[,"\n]/.test(String(x??''))?'"'+String(x).replace(/"/g,'""')+'"':(x??'');
  return[['Daily Equipment Report',d],['Engineer',M().eng],[],['Zone','Equipment no.','Type','Model','Plate','Owner','Foreman','Foreman salary no.','Operator','Operator salary no.','Status','Work h','Idle h','Down h','Activity','Notes']].concat(r.rows.map(x=>{const f=foreById(x.e.fore)||{};return[x.zone,x.e.no,x.e.type,x.e.model,x.e.plate,x.e.owner,f.name||'',f.sal||'',x.e.operator,x.e.opSal,st(x.e.status)[0],x.l.work??'',x.l.idle??'',x.l.down??'',x.l.act||'',x.e.notes]})).map(r=>r.map(q).join(',')).join('\n')}
function makePdf(d){

  try{const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'}),W=297,r=repData(d);

    row(cols.map(c=>c[0]),true,true);r.rows.forEach(x=>row([x.zone,x.e.no,x.e.type,foreName(x.e.fore),x.e.operator,x.e.opSal,st(x.e.status)[0],x.l.work!=null?fmt1(x.l.work):'—',x.l.idle!=null?fmt1(x.l.idle):'',x.l.down?fmt1(x.l.down):'',x.l.act||'']));

  $('bCp').onclick=()=>copy(JSON.stringify(S),'Backup');

  $('bMg').onclick=()=>{try{const o=readB();if(S.sample){S.equip=[];S.fore=[];S.logs=[];S.moves=[];S.fuel=[];S.maint=[];S.trips=[];S.ops=[];S.opHist=[];S.sample=false}mergeIn(o);save();toast('Merged');renderData()}catch(e){toast('That backup could not be read')}};
  $('bRs').onclick=()=>{try{const o=readB();S=Object.assign({del:{},metaUpd:0},o);normalize();save();brand();toast('Restored');renderData()}catch(e){toast('That backup could not be read')}};
  $('xS').onclick=()=>{makeSample();save();toast('Sample data loaded');renderData()};
  $('xC').onclick=()=>confirmBox($('xBox'),`Delete all machines, foremen and hours${syncOn()?' — on ALL synced devices':''}? Download a backup first.`,'Delete everything',()=>{['equip','fore','logs','moves','fuel','maint','trips','ops','opHist'].forEach(k=>S[k].slice().forEach(o=>delItem(k,o)));S.sample=false;save();toast('All data cleared');renderData()});
}
function download(name,text,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Download started — if nothing happens, use Copy')}catch(e){toast('Download blocked here — use Copy')}}
function copy(text,label){const fb=()=>{const t=$('bTx')||$('rBox');if(t){t.value=text;t.focus();t.select()}toast('Selected — copy it manually')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(label+' copied'),fb);else fb()}

/* ================= MERGE + SYNC ================= */
function mergeIn(o){
  S.del=S.del||{};Object.assign(S.del,o.del||{});
  ['equip','fore','logs','moves','fuel','maint','trips','ops','opHist'].forEach(k=>{
    S[k]=S[k].filter(x=>!(S.del[k+':'+x.id]>=(x.upd||0)));
    (o[k]||[]).forEach(x=>{if(!x||!x.id)return;if(S.del[k+':'+x.id]>=(x.upd||0))return;const i=S[k].findIndex(y=>y.id===x.id);if(i<0)S[k].push(x);else if((x.upd||0)>(S[k][i].upd||0))S[k][i]=x});
  });
  if((o.metaUpd||0)>(S.metaUpd||0)){const keep={email:S.meta.email,cc:S.meta.cc};S.meta=Object.assign(S.meta,o.meta||{},keep);S.metaUpd=o.metaUpd}
  normalize();
}
const SK='sheraz-sync';let SY={url:'',code:'',etag:'',last:0};
try{const g=JSON.parse(localStorage.getItem(SK)||'{}');SY.url=g.url||'';SY.code=g.code||''}catch(e){}
try{const g=JSON.parse(localStorage.getItem('sheraz-sync-eq')||'{}');SY.etag=g.etag||'';SY.last=g.last||0}catch(e){}
function saveSY(){try{const g=JSON.parse(localStorage.getItem(SK)||'{}');g.url=SY.url;g.code=SY.code;localStorage.setItem(SK,JSON.stringify(g));localStorage.setItem('sheraz-sync-eq',JSON.stringify({etag:SY.etag,last:SY.last}))}catch(e){}}
let dirty=false;try{dirty=localStorage.getItem('sheraz-eq-dirty')==='1'}catch(e){}
function setDirty(v){dirty=v;try{localStorage.setItem('sheraz-eq-dirty',v?'1':'0')}catch(e){}}
let syncing=false,syncAgain=false,syncT=null,lastErr='';
const syncOn=()=>!!(SY.url&&SY.code);
function strHash(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return(h>>>0).toString(36)+t.length}
function syncUrl(){return SY.url.trim().replace(/\/+$/,'')+'/eqa/'+encodeURIComponent(SY.code.trim()+'-EQUIP')+'.json'}
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function setSync(t,c){$('syncTxt').textContent=t;const i=document.querySelector('.sync i');i.style.background=c?`var(${c})`:''}
function showSyncState(){if(!syncOn()){setSync('Saved on this device');return}if(!navigator.onLine){setSync(dirty?'Offline · will sync':'Offline','--idle');return}if(lastErr){setSync('Sync problem','--down');return}setSync(SY.last?'Synced '+hhmm(SY.last):'Not synced yet',dirty?'--idle':'--work')}
const serialize=()=>JSON.stringify(Object.assign({},S,{sample:false}));
function syncSoon(ms){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),ms==null?4000:ms)}
async function syncNow(manual){
  if(!syncOn()){showSyncState();return}
  if(!navigator.onLine){showSyncState();if(manual)toast('No internet — data will sync when you are online');return}
  if(syncing){syncAgain=true;return}syncing=true;setSync('Syncing…','--idle');
  try{let done=false,merged=false;
    for(let a=0;a<4&&!done;a++){
      const r=await fetch(syncUrl(),{headers:{'X-Firebase-ETag':'true'},cache:'no-store'});
      if(r.status===401||r.status===403)throw new Error('Database rules block this sync code');if(!r.ok)throw new Error('Server answered '+r.status);
      const txt=await r.text(),real=r.headers.get('ETag')||'',etag=real||'h'+strHash(txt);let remote=null;try{remote=JSON.parse(txt)}catch(e){}
      const has=remote&&(Array.isArray(remote.equip)||remote.meta);
      if(etag===SY.etag&&!dirty){done=true;break}
      if(has&&etag!==SY.etag){if(S.sample){S.equip=[];S.fore=[];S.logs=[];S.moves=[];S.fuel=[];S.maint=[];S.trips=[];S.ops=[];S.opHist=[];S.del={};S.sample=false;S.metaUpd=0}const b=serialize();mergeIn(remote);if(serialize()!==b)merged=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
      if(!dirty&&has){SY.etag=etag;done=true;break}
      if(S.sample&&!has){done=true;break}
      const hd={'Content-Type':'application/json'};if(real){hd['X-Firebase-ETag']='true';hd['if-match']=real}
      const put=await fetch(syncUrl(),{method:'PUT',headers:hd,body:serialize()});
      if(put.status===412)continue;if(put.status===401||put.status===403)throw new Error('Database rules block writing');if(!put.ok)throw new Error('Upload failed ('+put.status+')');
      const pt=await put.text();SY.etag=put.headers.get('ETag')||'h'+strHash(pt);setDirty(false);done=true}
    if(!done)throw new Error('Another device is saving — try again');
    lastErr='';SY.last=Date.now();saveSY();if(merged&&sheet.hidden){brand();RENDER[curTab]()}
    if(manual)toast(merged?'Synced — new data received':'Synced — up to date');
  }catch(e){lastErr=e.message||'Sync failed';if(manual)toast(lastErr)}
  finally{syncing=false;showSyncState();if(syncAgain){syncAgain=false;syncSoon(1500)}}
}
window.addEventListener('online',()=>syncNow());window.addEventListener('offline',showSyncState);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},45000);
const PAIR_PAGE='eq.html';
function pairLink(page){const u=location.href.split(/[?#]/)[0].replace(/[^/]*$/,'')+page;return u+'?sync='+encodeURIComponent(btoa(unescape(encodeURIComponent(SY.url.trim()+'|'+SY.code.trim()))))}
function showPair(){const box=$('yLinkBox');if(!box)return;const L=pairLink(PAIR_PAGE);
  box.innerHTML=`<div class="card" style="margin-top:10px;padding:12px;box-shadow:none;background:var(--panel2)"><b>Link another device</b>
  <div class="small muted" style="margin-top:4px">Doosre device ke camera se yeh QR scan karein, ya link WhatsApp par bhej kar wahan kholein. Wahan dono apps (QA + Equipment) khud connect ho jayengi.</div>
  <div id="yQr" style="background:#fff;padding:10px;border-radius:10px;width:max-content;margin:10px auto"></div>
  <textarea readonly style="min-height:60px;font-size:11px">${esc(L)}</textarea><div class="row" style="margin-top:8px"><button class="btn acc sm" id="yLCp">Copy link</button></div>
  <div class="ur" style="margin-top:6px">Yeh link private rakhein — is se aap ka data khul sakta hai.</div></div>`;
  $('yLCp').onclick=()=>copy(L,'Link');
  try{if(window.QRCode)new QRCode($('yQr'),{text:L,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});else $('yQr').innerHTML='<span class="small" style="color:#333">QR needs internet once — use Copy link</span>'}catch(e){$('yQr').innerHTML='<span class="small" style="color:#333">Use Copy link</span>'}}
function takePair(){try{const q=new URLSearchParams(location.search).get('sync');if(!q)return false;const[u,c]=decodeURIComponent(escape(atob(q))).split('|');
  history.replaceState(null,'',location.href.split('?')[0]);if(!/^https:\/\/[^\s]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(u)||!c||c.length<20)return false;
  if(u===SY.url&&c===SY.code){toast('Already linked');return true}
  SY.url=u;SY.code=c;SY.etag='';SY.last=0;saveSY();lastErr='';toast('Linked — syncing your data…');return true}catch(e){return false}}
function syncCard(){const on=syncOn();
  return`<div class="card" style="border-top:5px solid var(--move)"><div class="ch"><h2>Auto sync</h2><small>${on?(lastErr?'<b style="color:var(--down)">'+esc(lastErr)+'</b>':SY.last?'Last synced '+hhmm(SY.last):'Not synced yet'):'Off'}</small></div>
  <div class="ur" style="margin-bottom:8px">Earthworks QA app wala hi Firebase URL aur Sync code yahan bhi chalega — equipment ka data alag jagah save hota hai. Phone aur laptop par same URL + same code.</div>
  <div class="fgrid"><label class="f" style="grid-column:1/-1">Firebase database URL<input id="yUrl" value="${esc(SY.url)}" placeholder="https://my-project-default-rtdb.firebaseio.com"></label>
  <label class="f" style="grid-column:1/-1">Sync code (keep it private)<input id="yCode" class="mono" value="${esc(SY.code)}" placeholder="Tap “New code” on the first device"></label></div>
  <div class="row" style="margin-top:10px"><button class="btn sm" id="yNew">New code</button><button class="btn sm" id="yCopy">Copy code</button></div>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="ySave">${on?'Save':'Connect'}</button>${on?'<button class="btn acc" id="yNow">Sync now</button><button class="btn sm" id="yLink">Link phone / laptop</button><button class="btn warn sm" id="yOff">Turn off</button>':''}</div><div id="yLinkBox"></div>${on?'':`<details style="margin-top:12px"><summary class="small" style="cursor:pointer;font-weight:700">Pehli dafa setup — 5 minute (sirf ek device par)</summary>
  <ol class="small" style="padding-left:18px;line-height:1.7;margin:8px 0">
  <li>Chrome mein <b>console.firebase.google.com</b> kholein, apne Google account se login</li>
  <li><b>Create a project</b> → naam (sheraz-qa) → Analytics off → Create</li>
  <li>Left menu <b>Build → Realtime Database → Create Database</b> → location → <b>locked mode</b> → Enable</li>
  <li><b>Rules</b> tab → sab mita kar neeche wale rules paste → <b>Publish</b></li>
  <li><b>Data</b> tab ka upar wala link copy karke yahan URL mein daalein → <b>New code</b> → <b>Connect</b></li>
  <li>Phir <b>Link phone / laptop</b> dabayein aur doosre device se QR scan karein</li></ol>
  <textarea readonly id="yRules" style="min-height:120px;font-size:11px">{\n  "rules": {\n    "eqa": {\n      "$code": {\n        ".read": "$code.length >= 20",\n        ".write": "$code.length >= 20"\n      }\n    }\n  }\n}</textarea>
  <button class="btn sm" id="yRulesCp" style="margin-top:6px">Copy rules</button></details>`}</div>`}
function bindSyncCard(){
  $('yNew').onclick=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=new Uint32Array(20);crypto.getRandomValues(r);r.forEach(v=>s+=a[v%a.length]);$('yCode').value=s.replace(/(.{5})(?=.)/g,'$1-');toast('New code made — tap Connect')};
  $('yCopy').onclick=()=>copy($('yCode').value,'Sync code');
  $('ySave').onclick=()=>{const u=$('yUrl').value.trim(),c=$('yCode').value.trim();
    if(!/^https:\/\/[^\s]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(u)){toast('Paste the database URL from Firebase');return}if(c.length<20){toast('Sync code is too short — tap “New code”');return}
    if(u!==SY.url||c!==SY.code){SY.etag='';SY.last=0;setDirty(!S.sample)}SY.url=u;SY.code=c;saveSY();lastErr='';toast('Connecting…');syncNow(true).then(()=>{if(curTab==='data')renderData()})};
  const lk=$('yLink');if(lk)lk.onclick=showPair;
  const rc=$('yRulesCp');if(rc)rc.onclick=()=>copy($('yRules').value,'Rules');
  const n=$('yNow');if(n)n.onclick=()=>syncNow(true).then(()=>{if(curTab==='data')renderData()});
  const f=$('yOff');if(f)f.onclick=()=>{SY.url='';SY.code='';SY.etag='';SY.last=0;saveSY();showSyncState();toast('Auto sync turned off');renderData()};
}

/* ================= boot ================= */
const RENDER={home:renderHome,zones:renderZones,equip:renderEquip,log:renderLog,fuel:renderFuel,maint:renderMaint,fore:renderFore,report:renderReport,data:renderData};
function brand(){$('appName').innerHTML=esc(M().eng)+'<small>Equipment Control'+(M().company?' · '+esc(M().company):'')+'</small>';$('logo').alt=M().eng}
if(!load()){makeSample();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
brand();renderHome();const paired=takePair();showSyncState();setTimeout(()=>syncNow(paired),paired?300:1500);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
