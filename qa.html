<style>
/* Layout: one-screen field app — brand header, scrolling tab views, bottom icon nav, bottom sheet for details. Strata (soil layers) is the visual motif. */
:root{
  --bg:#edf0ec; --panel:#ffffff; --panel2:#f5f7f4; --ink:#16211f; --muted:#5b6a65; --line:#d5ddd8;
  --brand:#123a35; --brand2:#1d5a51; --brand-ink:#eaf4f0; --accent:#d98b2b; --accent-ink:#241505;
  --sand:#d9c49a; --soil:#9c7a52; --clay:#7a5a3a;
  --cut:#c8433a; --fill:#2f73c0; --ok:#2f9a62; --near:#d6a01c; --held:#8e5bc4; --pend:#8a948f;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"Manrope",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(18,58,53,.06),0 6px 18px rgba(18,58,53,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --panel:#152120; --panel2:#1a2826; --ink:#e4ede9; --muted:#93a39e; --line:#273634;
  --brand:#0a2420; --brand2:#164a42; --brand-ink:#dcebe6; --accent:#e9a24a; --accent-ink:#241505;
  --sand:#8c7a58; --soil:#6e5539; --clay:#54402a;
  --cut:#ea6a5c; --fill:#5b9ee6; --ok:#4cc483; --near:#e9bb3f; --held:#ad85e0; --pend:#7c8884;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1413; --panel:#152120; --panel2:#1a2826; --ink:#e4ede9; --muted:#93a39e; --line:#273634;
  --brand:#0a2420; --brand2:#164a42; --brand-ink:#dcebe6; --accent:#e9a24a; --accent-ink:#241505;
  --sand:#8c7a58; --soil:#6e5539; --clay:#54402a;
  --cut:#ea6a5c; --fill:#5b9ee6; --ok:#4cc483; --near:#e9bb3f; --held:#ad85e0; --pend:#7c8884;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--brand-ink);padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:11px;flex:none}
.logo{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.25)}
h1{min-width:0;font-family:var(--display);font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em;margin:0;line-height:.95;font-weight:800}
h1 small{font:600 10px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.72;display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.who b{display:none!important}.who{flex:none}.sync span{display:none}}
.who{margin-left:auto;text-align:right;font-size:11px;line-height:1.3;opacity:.92;min-width:0}
.who b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;opacity:.8}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px rgba(76,196,131,.2)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:14px 28px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.view.full{padding:0;overflow:hidden}
nav{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow-x:auto}
nav button{flex:1;min-width:42px;background:none;border:0;color:var(--muted);font:600 9.5px var(--body);letter-spacing:.02em;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand2)}
:root:not([data-theme="light"]) nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
@media (prefers-color-scheme:light){nav button.on{color:var(--brand2)}}
:root[data-theme="light"] nav button.on{color:var(--brand2)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
h2{font-family:var(--display);font-size:20px;letter-spacing:.04em;margin:0;text-transform:uppercase;font-weight:700}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch small{color:var(--muted);font-size:11.5px}
.muted{color:var(--muted)}.small{font-size:12px}
.ur{font-size:11.5px;color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;box-sizing:border-box}
textarea{width:100%;font-family:var(--mono);font-size:12px;min-height:110px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select{color:var(--ink);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.btn{font:700 13px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--cut)}
.btn.sm{padding:7px 10px;font-size:12px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,nav button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
/* hero */
.hero{background:linear-gradient(160deg,var(--brand),var(--brand2));color:var(--brand-ink);border-radius:18px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.hero canvas{display:block;width:100%;height:170px;margin-top:6px}
.hin{padding:16px 16px 4px;position:relative}
.hn{font-family:var(--display);font-weight:800;font-size:30px;line-height:.95;letter-spacing:.02em}
.hs{font-size:12px;opacity:.8;margin-top:4px}
.hgrid{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:14px}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:800}
.ring b span{display:block;font:600 9px var(--body);letter-spacing:.12em;opacity:.7;margin-top:-30px}
.hk{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.hk div b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hk div span{font-size:10.5px;opacity:.75;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line))}
.kpi b{font-family:var(--display);font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
.verdict{display:flex;gap:12px;align-items:center}
.gauge{width:110px;flex:none}
.bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line)}
.bar span{display:block;height:100%}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:13.5px}
.li .t span{font-size:11.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* plan */
#planBox{position:absolute;inset:0}
canvas.map{display:block;width:100%;height:100%;touch-action:none;background:var(--bg)}
.mapbar{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.mapbar>*{pointer-events:auto;box-shadow:var(--shadow)}
.mapbar select{padding:7px 8px;font-size:12.5px}
.legend{position:absolute;bottom:10px;left:max(10px,env(safe-area-inset-left,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px 11px;font-size:11.5px;max-width:calc(100% - 84px);box-shadow:var(--shadow)}
.lg{display:flex;align-items:center;gap:5px}
.fab{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.fab .btn{width:44px;height:44px;padding:0;font-size:18px;box-shadow:var(--shadow)}
.fab .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.info{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:20px;white-space:nowrap;box-shadow:var(--shadow);max-width:90%;overflow:hidden;text-overflow:ellipsis}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel2);position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.tap{cursor:pointer}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.28);max-height:86%;overflow:auto;z-index:20;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grip{width:42px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.dl div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dl b{display:block;font-family:var(--mono);font-size:14.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.dl small{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.03em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:13px;font-weight:600;z-index:40;max-width:90%;text-align:center}
.confirm{background:var(--panel2);border:1px solid var(--cut);border-radius:10px;padding:10px;margin-top:8px}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:16px;border-bottom:1px solid var(--line)}
.chart .c{flex:1;background:linear-gradient(to top,var(--brand2),var(--fill));border-radius:4px 4px 0 0;position:relative;min-width:5px}
.chart .c i{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;color:var(--muted)}
.xl{display:flex;gap:4px;font-size:9.5px;color:var(--muted);margin-top:3px}
.xl span{flex:1;text-align:center;min-width:5px;overflow:hidden}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:700 12px var(--body);padding:7px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.result{border-radius:14px;padding:14px;color:#fff;display:flex;align-items:center;gap:12px}
.result b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
#three{position:absolute;inset:44px 0 0 0;touch-action:none}
#threeBar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.03em}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}}}
</style>

/* convex hull with buffer (m) */
function hull(P,buf){
  P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(P.length<3)return P;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  const h=lo.slice(0,-1).concat(up.slice(0,-1));if(!buf)return h;
  const cx=h.reduce((a,p)=>a+p[0],0)/h.length,cy=h.reduce((a,p)=>a+p[1],0)/h.length;
  return h.map(p=>{const dx=p[0]-cx,dy=p[1]-cy,d=Math.hypot(dx,dy)||1;return[+(p[0]+dx/d*buf).toFixed(3),+(p[1]+dy/d*buf).toFixed(3)]});
}

function parseWirPts(t){

function vols(ps){
  const c=M().cell;let fT=0,fD=0,cT=0,cD=0;

/* ================= UTM ================= */
function ll2utm(lat,lon,zone){
  const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2);
  const lon0=((zone-1)*6-180+3)*Math.PI/180,φ=lat*Math.PI/180,λ=lon*Math.PI/180;
  const N=a/Math.sqrt(1-e2*Math.sin(φ)**2),T=Math.tan(φ)**2,C=ep2*Math.cos(φ)**2,A=Math.cos(φ)*(λ-lon0);
  const Mm=a*((1-e2/4-3*e2**2/64-5*e2**3/256)*φ-(3*e2/8+3*e2**2/32+45*e2**3/1024)*Math.sin(2*φ)+(15*e2**2/256+45*e2**3/1024)*Math.sin(4*φ)-(35*e2**3/3072)*Math.sin(6*φ));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  const Nn=k0*(Mm+N*Math.tan(φ)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  return[E,lat<0?Nn+1e7:Nn];
}

function pStat(p){

    return{kind:'fill',total,rem:Math.max(0,rem),over:rem<-tol?-rem:0,need,done,left,pct:Math.max(0,Math.min(100,(c-p.ngl)/total*100)),fin:Math.abs(rem)<=tol}}
  if(p.ngl>p.dg+tol){const total=p.ngl-p.dg,rem=c-p.dg;
    return{kind:'cut',total,rem:Math.max(0,rem),over:rem<-tol?-rem:0,done:Math.max(0,Math.min(total,p.ngl-c)),pct:Math.max(0,Math.min(100,(p.ngl-c)/total*100)),fin:Math.abs(rem)<=tol,left:layersLeft(p)}}
  return{kind:'level',total:Math.abs(p.dg-p.ngl),rem:Math.abs(c-p.dg),fin:Math.abs(c-p.dg)<=tol,pct:100,over:0,left:layersLeft(p)}
}

function workLeftSummary(ps){
  const f={},c={b1:0,b2:0,b3:0,b4:0},o={fillDone:0,cutDone:0,level:0,over:0};
  ps.forEach(p=>{const s=pStat(p);if(s.kind==='fill'){if(s.over)o.over++;if(s.fin||s.over)o.fillDone++;else f[s.left]=(f[s.left]||0)+1}
    else if(s.kind==='cut'){if(s.over)o.over++;if(s.fin||s.over)o.cutDone++;else if(s.rem<=0.3)c.b1++;else if(s.rem<=0.6)c.b2++;else if(s.rem<=1)c.b3++;else c.b4++}else o.level++});
  return{f,c,o};
}

function bwTri(P){
  const n=P.length;if(n<3)return[];
  let mx=0,my=0;P.forEach(p=>{mx+=p[0];my+=p[1]});mx/=n;my/=n;
  const X=new Float64Array(n+3),Y=new Float64Array(n+3);let span=1;
  for(let i=0;i<n;i++){X[i]=P[i][0]-mx+(((i*7919)%997)-498)*2e-6;Y[i]=P[i][1]-my+(((i*104729)%991)-495)*2e-6;span=Math.max(span,Math.abs(X[i]),Math.abs(Y[i]))}
  const s=span*30;X[n]=-s;Y[n]=-s;X[n+1]=s;Y[n+1]=-s;X[n+2]=0;Y[n+2]=s;
  const mk=(a,b,c)=>{const ax=X[a],ay=Y[a],bx=X[b],by=Y[b],cx=X[c],cy=Y[c];const d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));if(Math.abs(d)<1e-12)return null;
    const a2=ax*ax+ay*ay,b2=bx*bx+by*by,c2=cx*cx+cy*cy;const ux=(a2*(by-cy)+b2*(cy-ay)+c2*(ay-by))/d,uy=(a2*(cx-bx)+b2*(ax-cx)+c2*(bx-ax))/d;const r=(ax-ux)*(ax-ux)+(ay-uy)*(ay-uy);return{a,b,c,x:ux,y:uy,r,rr:Math.sqrt(r)}};
  const order=Array.from({length:n},(_,i)=>i).sort((a,b)=>X[a]-X[b]);
  let T=[mk(n,n+1,n+2)];const done=[],N=n+3;
  for(const i of order){const px=X[i],py=Y[i],keep=[],ed=new Map();
    for(const t of T){if(t.x+t.rr<px){done.push(t);continue}const dx=px-t.x,dy=py-t.y;
      if(dx*dx+dy*dy<t.r){for(const[u,v]of[[t.a,t.b],[t.b,t.c],[t.c,t.a]]){const k=u<v?u*N+v:v*N+u;const e=ed.get(k);if(e)e[2]++;else ed.set(k,[u,v,1])}}else keep.push(t)}
    ed.forEach(e=>{if(e[2]===1){const t=mk(e[0],e[1],i);if(t)keep.push(t)}});T=keep}
  const out=done.concat(T).filter(t=>t.a<n&&t.b<n&&t.c<n).map(t=>[t.a,t.b,t.c]);
  if(!out.length)return out;
  const L=out.map(t=>Math.max(Math.hypot(X[t[0]]-X[t[1]],Y[t[0]]-Y[t[1]]),Math.hypot(X[t[1]]-X[t[2]],Y[t[1]]-Y[t[2]]),Math.hypot(X[t[2]]-X[t[0]],Y[t[2]]-Y[t[0]])));

  return out.filter((t,j)=>L[j]<=med*2.2);
}

function pileVolume(txt,base,cell){
  const pts=[];let skipped=0;
  txt.split(/\r?\n/).forEach(l=>{const c=l.split(/[,\t;]|\s{2,}/).map(s=>s.trim()).filter(s=>s!=='');if(c.length<4){if(c.length)skipped++;return}
    const nums=c.slice(1).map(parseFloat);if(nums.some(isNaN)){skipped++;return}let[e,n]=nums;if(e>1e6&&n<1e6){const t=e;e=n;n=t}
    let b,top;if(nums.length>=4){b=nums[2];top=nums[3]}else{top=nums[2];b=null}
    if(b==null){const q=S.points.find(x=>x.id===c[0]);if(q)b=q.ngl;else{let best=null,bd=Math.sqrt(cell)*0.75;S.points.forEach(x=>{const d=Math.hypot(x.e-e,x.n-n);if(d<bd){bd=d;best=x}});if(best)b=best.ngl;else if(!isNaN(base))b=base}}
    if(b==null||isNaN(b)){skipped++;return}pts.push([c[0],+e.toFixed(3),+n.toFixed(3),+(+b).toFixed(3),+top.toFixed(3)])});
  const vol=pts.reduce((a,q)=>a+Math.max(0,q[4]-q[3]),0)*cell,area=pts.filter(q=>q[4]-q[3]>0.02).length*cell,maxH=pts.reduce((a,q)=>Math.max(a,q[4]-q[3]),0);
  return{pts,vol,area,maxH,skipped};
}

function skZ(p){return sk.target==='design'?p.dg:sk.target==='prep'?p.ngl-M().lay:nextReq(p)}
function skCode(p){const s=pStat(p);if(sk.target==='design')return'FG';if(sk.target==='prep')return'PREP';if(s.kind==='cut')return'CUT';return s.kind==='fill'?'L'+(nL(p)+1):'FG'}
function skCSV(R){return R.map(p=>{const z=skZ(p).toFixed(3);return(sk.fmt==='PENZ'?[p.id,p.e.toFixed(3),p.n.toFixed(3),z,skCode(p)]:[p.id,p.n.toFixed(3),p.e.toFixed(3),z,skCode(p)]).join(',')}).join('\n')}
function foremanText(R){

/* ---- spot check ---- */
let spSel='';
function makeSpot(w,pct){
  const P=w.pts.filter(p=>!isNaN(p.nw));if(!P.length)return null;const n=Math.min(P.length,Math.max(5,Math.round(P.length*pct/100)));
  let seed=0;for(const ch of w.no+Date.now())seed=(seed*31+ch.charCodeAt(0))>>>0;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const out=new Map();
  P.filter(p=>p.dg!=null&&!isNaN(p.dg)&&p.dg-p.nw<-M().tol).slice(0,2).forEach(p=>out.set(p.id,p));
  const ck=wirChecks(w);if(ck&&ck.patterned)P.filter(p=>Math.round((p.nw-p.prev)*1000)===ck.topTh).slice(0,2).forEach(p=>out.set(p.id,p));
  const pool=P.slice();while(out.size<n&&pool.length){const i=Math.floor(rnd()*pool.length);out.set(pool[i].id,pool[i]);pool.splice(i,1)}
  return{id:nid('sc'),wir:w.no,date:today(),upd:Date.now(),pts:[...out.values()].map(p=>{const g=S.points.find(x=>x.id===p.id)||{};return{id:p.id,e:p.e??g.e,n:p.n??g.n,their:p.nw,dg:p.dg,mine:null}})};
}
function spotRes(s){const d=s.pts.filter(x=>x.mine!=null&&!isNaN(x.mine));const pass=d.filter(x=>Math.abs(x.mine-x.their)<=M().tol).length;return{done:d.length,pass,fail:d.length-pass,n:s.pts.length,mean:d.length?d.reduce((a,x)=>a+(x.mine-x.their),0)/d.length:0}}
function renderSpot(host){
  const W=S.wirs.filter(w=>w.pts.length).sort((a,b)=>b.date.localeCompare(a.date));
  const sess=S.spots.filter(s=>!spSel||s.wir===spSel).sort((a,b)=>(b.upd||0)-(a.upd||0));const cs=sess[0];
  host.insertAdjacentHTML('beforeend',`<div class="card"><div class="ch"><h2>Spot check a WIR</h2><small>random points to re-survey</small></div>
    <div class="fgrid"><label class="f">WIR<select id="spW"><option value="">Choose…</option>${W.map(w=>`<option value="${esc(w.no)}"${w.no===spSel?' selected':''}>${esc(w.no)} · ${esc(w.area)} · ${esc(w.layer)}</option>`).join('')}</select></label><label class="f">Sample %<input id="spP" type="number" value="10" min="1" max="100"></label></div>
    <div class="ur" style="margin-top:6px">App random points chunti hai, aur design se upar wale ya "patterned" points zaroor shamil karti hai. Site par in ka level le kar neeche likhein.</div>
    <button class="btn pri" id="spNew" style="margin-top:10px"${spSel?'':' disabled'}>Make a new spot list</button></div>
  ${cs?(()=>{const r=spotRes(cs);return`<div class="card"><div class="ch"><h2>${esc(cs.wir)} · ${dNice(cs.date)}</h2><small>${r.done}/${r.n} measured</small></div>
    ${r.done?`<div class="row" style="gap:6px;margin-bottom:8px">${pill([r.pass+' pass','--ok'])}${r.fail?pill([r.fail+' fail','--cut']):''}${pill(['avg '+cm(r.mean)+' cm','--fill'])}</div>`:''}
    <div class="tbl"><table><thead><tr><th>Point</th><th style="text-align:right">Contractor</th><th>My level</th><th style="text-align:right">Diff cm</th></tr></thead><tbody>
    ${cs.pts.map((x,i)=>{const d=x.mine!=null&&!isNaN(x.mine)?x.mine-x.their:null;return`<tr><td>${esc(x.id)}</td><td style="text-align:right">${f3(x.their)}</td><td><input type="number" step="0.001" inputmode="decimal" data-i="${i}" value="${x.mine??''}" style="width:96px"></td><td style="text-align:right;font-weight:700;color:var(${d==null?'--muted':Math.abs(d)<=M().tol?'--ok':'--cut'})">${d==null?'—':cm(d)}</td></tr>`}).join('')}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn acc" id="spSave">Save levels</button><button class="btn" id="spCsv">Copy stakeout list</button><button class="btn sm warn" id="spDel">Delete list</button></div><div id="spBox"></div></div>`})():''}
  ${sess.length>1?`<div class="card"><div class="ch"><h2>Earlier spot checks</h2></div><div class="list">${sess.slice(1).map(s=>{const r=spotRes(s);return`<div class="li" style="cursor:default"><div class="t"><b>${esc(s.wir)} · ${dNice(s.date)}</b><span>${r.done}/${r.n} measured · ${r.pass} pass · ${r.fail} fail</span></div></div>`}).join('')}</div></div>`:''}`);
  $('spW').onchange=e=>{spSel=e.target.value;renderCheck()};
  $('spNew').onclick=()=>{const w=S.wirs.find(x=>x.no===spSel);const s=w&&makeSpot(w,+$('spP').value||10);if(!s){toast('This WIR has no points');return}S.spots.push(s);save();toast(s.pts.length+' points picked');renderCheck()};
  if(!cs)return;
  $('spSave').onclick=()=>{host.querySelectorAll('[data-i]').forEach(inp=>{const v=parseFloat(inp.value);cs.pts[+inp.dataset.i].mine=isNaN(v)?null:+v.toFixed(3)});cs.upd=Date.now();save();const r=spotRes(cs);toast(`${r.pass} pass · ${r.fail} fail`);renderCheck()};
  $('spCsv').onclick=()=>copy(cs.pts.map(x=>[x.id,(+x.e).toFixed(3),(+x.n).toFixed(3),f3(x.their),'SPOT'].join(',')).join('\n'),'Spot list');
  $('spDel').onclick=()=>confirmBox($('spBox'),'Delete this spot list?','Delete',()=>{delGen('spots',cs);save();renderCheck()});
}

    const oe=parseFloat($('bmE').value),on=parseFloat($('bmN').value);const dxy=!isNaN(oe)&&!isNaN(on)?Math.hypot(oe-b.e,on-b.n):null;
    const pass=Math.abs(oz-b.z)<=tol&&(dxy==null||dxy<=tol*2);

/* ================= ALERTS ================= */
function alerts(){
  const A=[],t=today(),lay=M().lay,tol=M().tol;
  let thick=0;S.points.forEach(p=>{const L=p.layers;for(let i=1;i<L.length;i++){if(L[i].k==='fill'&&L[i].date>dAdd(t,-30)&&L[i].rl-L[i-1].rl>lay+0.05){thick++;break}}});
  if(thick)A.push({c:'--near',t:`${thick} points have a layer thicker than ${((lay+0.05)*100).toFixed(0)} cm (last 30 days)`,go:()=>{volMode='cmp';cmpF.prev='prevlayer';cmpF.cur='latest';cmpF.target=String(lay);go('vol')}});
  let of=0,oc=0;S.points.forEach(p=>{const s=pStat(p);if(s.over){if(s.kind==='fill')of++;else if(s.kind==='cut')oc++}});
  if(of)A.push({c:'--cut',t:`${of} fill points are above design (over-fill)`,go:()=>{go('plan');$('fColor').value='type';drawPlan()}});
  if(oc)A.push({c:'--cut',t:`${oc} cut points are below design (over-cut)`,go:()=>{go('plan');$('fColor').value='type';drawPlan()}});
  const pend=S.wirs.filter(w=>w.status==='pending'&&w.date<=dAdd(t,-3)),held=S.wirs.filter(w=>w.status==='held'&&w.date<=dAdd(t,-3));
  if(pend.length)A.push({c:'--near',t:`${pend.length} WIR pending more than 3 days (${pend.slice(0,3).map(w=>w.no).join(', ')})`,go:()=>{wirFilter='pending';go('wir')}});
  if(held.length)A.push({c:'--held',t:`${held.length} WIR held more than 3 days`,go:()=>{wirFilter='held';go('wir')}});
  const ar={};S.points.forEach(p=>{if(!p.area)return;const a=ar[p.area]=ar[p.area]||{last:'',left:0};p.layers.forEach(l=>{if((l.date||'')>a.last)a.last=l.date});if(!pStat(p).fin)a.left++});
  const idle=Object.keys(ar).filter(a=>ar[a].last&&ar[a].left&&ar[a].last<dAdd(t,-7));
  if(idle.length)A.push({c:'--pend',t:`No work for 7+ days in ${idle.length} area${idle.length>1?'s':''} with work left: ${idle.slice(0,4).join(', ')}${idle.length>4?'…':''}`,go:()=>go('vol')});
  const sf=S.spots.filter(s=>spotRes(s).fail);if(sf.length)A.push({c:'--cut',t:`Spot check failed on ${sf.map(s=>s.wir).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}`,go:()=>{fieldMode='spot';spSel=sf[0].wir;go('check')}});
  if(S.bms.length){const lb=S.bmlog.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(lb&&!lb.pass)A.push({c:'--cut',t:`Last BM check failed (${lb.bm}, ${dNice(lb.date)})`,go:()=>{fieldMode='bm';go('check')}});
    else if(!lb||lb.date<dAdd(t,-7))A.push({c:'--pend',t:lb?`No BM check since ${dNice(lb.date)}`:'No BM check recorded yet',go:()=>{fieldMode='bm';go('check')}})}
  S.piles.forEach(p=>{if(pileCalc(p).neg)A.push({c:'--near',t:`${p.name}: more removed than surveyed — take a new survey`,go:()=>{go('piles')}})});
  return A;
}
function alertsCard(){const A=alerts();if(!A.length)return`<div class="card" style="border-color:var(--ok)"><div class="row"><span class="pill" style="--c:var(--ok)">All clear</span><span class="small muted">No alerts right now</span></div></div>`;

let repMode='daily';
function sData(){
  const sc=schedule(),bt=boqTot(),v=vols(S.points);const tot=(bt.fill+bt.cut)||v.tot||1;
  const pd=prodByDate();const weeks=[];let d=sc.start;
  while(d<=sc.end){weeks.push(d);d=dAdd(d,7)}if(weeks[weeks.length-1]<sc.end)weeks.push(sc.end);
  const sm=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  let cum=0;const dates=Object.keys(pd).sort();const pre=dates.filter(x=>x<sc.start).reduce((a,x)=>a+pd[x],0);cum=pre;
  const rows=weeks.map((w,i)=>{const nx=weeks[i+1]||dAdd(w,7);let wk=0;dates.forEach(x=>{if(x>=w&&x<nx)wk+=pd[x]});const end=dAdd(nx,-1);
    const plan=tot*sm(dDiff(sc.start,end>sc.end?sc.end:end)/Math.max(1,dDiff(sc.start,sc.end)));const past=w<=today();if(past)cum+=wk;return{w,end,wk,plan,act:past?cum:null}});
  return{sc,tot,rows};
}
function sCurveSvg(D){

  const P=D.rows.map((r,i)=>`${X(i).toFixed(1)},${Y(r.plan).toFixed(1)}`).join(' '),A=D.rows.filter(r=>r.act!=null).map((r,i)=>`${X(i).toFixed(1)},${Y(Math.min(r.act,D.tot*1.2)).toFixed(1)}`).join(' ');
  const ti=D.rows.findIndex(r=>r.w<=today()&&today()<=r.end);
  let g='';for(let k=0;k<=4;k++){const y=Y(D.tot*k/4);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${k*25}%</text>`}
  const step=Math.max(1,Math.ceil(n/8));D.rows.forEach((r,i)=>{if(i%step===0)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${+r.w.slice(8)} ${MON[+r.w.slice(5,7)-1]}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="S-curve planned versus actual">${g}
    ${ti>=0?`<line x1="${X(ti)}" x2="${X(ti)}" y1="${pt}" y2="${H-pb}" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="${X(ti)+4}" y="${pt+10}" font-size="10" fill="var(--accent)">today</text>`:''}
    <polyline points="${P}" fill="none" stroke="var(--pend)" stroke-width="2.5" stroke-dasharray="7 5"/>
    ${A?`<polyline points="${A}" fill="none" stroke="var(--fill)" stroke-width="3"/>`:''}
    ${(()=>{const L=D.rows.filter(r=>r.act!=null);if(!L.length)return'';const i=L.length-1;return`<circle cx="${X(i)}" cy="${Y(Math.min(L[i].act,D.tot*1.2))}" r="5" fill="var(--fill)"/>`})()}</svg>`;
}

const PDB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open('sheraz-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async put(id,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(v,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  async get(id){const db=await this.open();return new Promise(res=>{const t=db.transaction('p','readonly').objectStore('p').get(id);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)})},
  async del(id){const db=await this.open();return new Promise(res=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>res()})}};

function areaRec(a){

  const L={};const add=(k,p,l,prev)=>{const r=L[k]=L[k]||{k,pts:new Set(),first:'',last:'',wirs:new Set(),th:[]};r.pts.add(p.id);if(l.date){if(!r.first||l.date<r.first)r.first=l.date;if(l.date>r.last)r.last=l.date}if(l.wir)r.wirs.add(l.wir);if(prev!=null)r.th.push(l.rl-prev)};

  const need=k=>k==='PREP'?fillPs.length:k==='CUT'?cutPs.length:fillPs.filter(p=>layersNeeded(p)>=+k.slice(1)&&(!pStat(p).fin||nL(p)>=+k.slice(1))).length;
  const rows=[...new Set(keys)].map(k=>{const r=L[k]||{pts:new Set(),wirs:new Set(),th:[],first:'',last:''};const n=need(k),d=r.pts.size;const th=r.th.length?r.th.reduce((a,b)=>a+b,0)/r.th.length:null;
    return{k,need:n,done:d,first:r.first,last:r.last,wirs:[...r.wirs].sort(),th,st:!n&&!d?'na':d===0?'none':d>=n?'done':'part'}}).filter(r=>r.st!=='na');

let repDate='';
const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—';
function reportData(){
  const ps=S.points,v=vols(ps),ls=layerStats(ps),c={cut:0,fill:0,near:0,ok:0};ps.forEach(p=>c[status(p)]++);
  const areas={};ps.forEach(p=>{(areas[p.area||'—']=areas[p.area||'—']||[]).push(p)});
  const ar=Object.keys(areas).sort().map(k=>{const a=vols(areas[k]),l=layerStats(areas[k]);return[k,areas[k].length,areas[k].filter(p=>status(p)==='ok').length,l.done+'/'+l.need,fmt(a.fR),fmt(a.cR),(a.tot?a.done/a.tot*100:0).toFixed(0)+'%']});
  return{v,ls,c,ar,n:ps.length};
}
function dayWork(d){
  return S.wirs.filter(w=>w.date===d).map(w=>{const q=wirQty(w);let t;
    if(w.kind==='strip')t=`stripping, ${fmt(q.area)} m²`;else if(w.kind==='waste')t=`waste removed, about ${fmt(q.vol)} m³`;else if(w.kind==='cut')t=`cut ${fmt(q.vol)} m³ over ${fmt(q.area)} m²`;else if(w.kind==='fill')t=`fill ${fmt(q.vol)} m³ over ${fmt(q.area)} m²`;else t=w.act;
    return{w,line:`- ${w.no}: ${w.desc||w.act+' '+(w.area||'')} (${t}) — ${(WST[w.status]||WST.pending)[0]}`}});
}
function progressLines(d){
  const D=doneData(d),bt=boqTot(),L=[];
  L.push(`- Stripping 30 cm: ${fmt(D.strip)} m² (${pct(D.strip,bt.strip)} of BOQ)`);
  if(D.hStrip)L.push(`  – certified ${fmt(D.strip-D.hStrip)} m², held ${fmt(D.hStrip)} m² pending verification`);
  L.push(`- Fill placed: ${fmt(D.fill)} m³ (${pct(D.fill,bt.fill)} of BOQ)`);
  if(D.hFill)L.push(`  – certified ${fmt(D.fill-D.hFill)} m³, held ${fmt(D.hFill)} m³ pending verification`);
  L.push(`- Cut: ${D.cut>0?fmt(D.cut)+' m³ ('+pct(D.cut,bt.cut)+' of BOQ)':'not started'}`);
  if(D.waste)L.push(`- Waste removed (WIRs): ${fmt(D.waste)} m³`);
  if(S.piles.length){const T=pilesTot(d);L.push(`- Waste stockpiles: ${fmt(T.rem)} m³ remaining in ${T.n} stockpiles, ${fmt(T.out)} m³ removed to date`)}
  return L;
}

Today's work:
${dw.length?dw.map(x=>x.line).join('\n'):'No WIR was inspected or submitted on this day.'}

${pileDay(d).length?`Stockpiles today:\n${pileDay(d).map(pileLine).join('\n')}\n\n`:''}Progress to date:
${progressLines(d).join('\n')}

Production speed: ${fmt(sp.recent)} m³/day (last 14 days), required ${fmt(sp.req)} m³/day to finish by ${dNice(sp.sc.end)}.

Best regards,
${M().eng}
${M().role}`;
}

  const dw=dayWork(d);para("Today's work",dw.length?dw.map(x=>x.line):['No WIR was inspected or submitted on this day.']);

  $('bMg').onclick=()=>{try{const o=JSON.parse($('bTx').value);if(!o||!Array.isArray(o.points))throw 0;if(S.sample&&!o.sample){S.points=[];S.wirs=[];S.checks=[];S.bounds=[];S.bms=[];S.boq={};S.piles=[];S.bmlog=[];S.photos=[];S.spots=[];S.anotes=[];S.sample=false;S.meta=Object.assign(S.meta,o.meta||{})}const st=mergeIn(o);save();view.init=false;brand();toast(`Merged: ${st.pts} points, ${st.lay} levels, ${st.wir} WIRs, ${st.chk} checks`);renderData()}catch(e){toast('That backup could not be read. Choose the backup file again.')}};
  $('bRs').onclick=()=>{try{const o=JSON.parse($('bTx').value);if(!o||!Array.isArray(o.points))throw 0;S.meta=Object.assign(S.meta,o.meta||{});S.points=o.points;S.wirs=o.wirs||[];S.checks=o.checks||[];S.bounds=o.bounds||[];S.bms=o.bms||[];S.boq=o.boq||{};S.piles=o.piles||[];S.bmlog=o.bmlog||[];S.photos=o.photos||[];S.spots=o.spots||[];S.anotes=o.anotes||[];S.sample=!!o.sample;normalize();save();view.init=false;brand();toast(`Restored ${S.points.length} points`);renderData()}catch(e){toast('That backup could not be read. Paste the full text.')}};
  $('xS').onclick=()=>{makeSample();M().proj='Sample Project';save();view.init=false;brand();toast('Sample data loaded');renderData()};
  $('xC').onclick=()=>confirmBox($('xBox'),`Delete all ${S.points.length} points, ${S.wirs.length} WIRs, boundaries, BMs and every layer${syncOn()?' — on ALL synced devices':' from this device'}? Download a backup first.`,'Delete everything',()=>{S.points.forEach(x=>delMark('p',x.id));S.wirs.forEach(w=>delMark('w',w.no));S.piles.forEach(x=>{S.del.s=S.del.s||{};S.del.s[ek(x.id)]=Date.now()});S.piles=[];['bmlog','photos','spots','anotes'].forEach(k=>S[k].slice().forEach(o=>delGen(k,o)));S.points=[];S.wirs=[];S.checks=[];S.bounds=[];S.bms=[];S.boq={};S.sample=false;save();brand();toast('All data cleared');renderData()});
}
function parseCSV(t){const o=[];t.split(/\r?\n/).forEach(l=>{const c=l.split(/[,\t;]/).map(s=>s.trim());if(c.length<5)return;let e=parseFloat(c[1]),n=parseFloat(c[2]);const ngl=parseFloat(c[3]),dg=parseFloat(c[4]);if([e,n,ngl,dg].some(isNaN))return;if(e>1e6&&n<1e6){const x=e;e=n;n=x}o.push({id:c[0],e,n,ngl,dg,zone:c[5]||'',area:c[6]||'',layers:[]})});return o}
function pointsCSV(){
  const q=x=>/[,"\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x;
  const rows=[[M().proj],['Engineer: '+M().eng],['Date: '+today()],[],['Point','Easting','Northing','Phase','Area','NGL','Design','Current RL','Diff (m)','Status','Layers done','Layers needed','Layers left','Last date','Last WIR']];
  S.points.forEach(p=>{const l=p.layers[p.layers.length-1]||{};rows.push([p.id,p.e,p.n,p.zone,p.area,f3(p.ngl),f3(p.dg),f3(cur(p)),diff(p).toFixed(3),STAT[status(p)][0],nL(p),layersNeeded(p),layersLeft(p),l.date||'',l.wir||''])});
  rows.push([],['Layer record'],['Point','Layer','Date','RL','vs Design (m)','WIR']);
  S.points.forEach(p=>{let f=0;p.layers.forEach(l=>rows.push([p.id,l.k==='strip'?'PREP':'L'+(++f),l.date,f3(l.rl),(l.rl-p.dg).toFixed(3),l.wir||'']))});
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function download(name,text,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Download started — if nothing happens, use Copy')}catch(e){toast('Download blocked here — use Copy')}}
function copy(text,label){const fb=()=>{const t=$('bTx')||$('rBox');if(t){t.value=text;t.focus();t.select()}toast('Selected — copy it manually')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(label+' copied'),fb);else fb()}


/* ================= SYNC ================= */
const SK='sheraz-sync';let SY={url:'',code:'',etag:'',last:0};
try{SY=Object.assign(SY,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
function saveSY(){try{localStorage.setItem(SK,JSON.stringify(SY))}catch(e){}}
let dirty=false;try{dirty=localStorage.getItem('sheraz-dirty')==='1'}catch(e){}
function setDirty(v){dirty=v;try{localStorage.setItem('sheraz-dirty',v?'1':'0')}catch(e){}}
let syncing=false,syncAgain=false,syncT=null,lastErr='';
const syncOn=()=>!!(SY.url&&SY.code);
function strHash(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return(h>>>0).toString(36)+t.length}
function syncUrl(){return SY.url.trim().replace(/\/+$/,'')+'/eqa/'+encodeURIComponent(SY.code.trim())+'.json'}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function setSync(t,c){const e=$('syncTxt');if(e)e.textContent=t;const i=document.querySelector('.sync i');if(i){i.style.background=c?`var(${c})`:'';i.style.boxShadow=c?'none':''}}
function showSyncState(){
  if(!syncOn()){setSync('Saved on this device');return}
  if(!navigator.onLine){setSync(dirty?'Offline · will sync':'Offline','--near');return}
  if(lastErr){setSync('Sync problem','--cut');return}
  setSync(SY.last?'Synced '+hhmm(SY.last):'Not synced yet',dirty?'--near':'--ok');
}
function serialize(){const o=Object.assign({},S,{boq:Object.entries(S.boq||{}).map(([z,v])=>Object.assign({z},v)),sample:false});return JSON.stringify(o)}
function rerender(){if(!sheet.hidden)return;({home:renderHome,plan:()=>{fillFilters();drawPlan()},wir:renderWir,check:renderCheck,vol:renderVol,'3d':()=>{},piles:renderPiles,report:renderReport,data:renderData})[curTab]()}
function syncSoon(ms){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),ms==null?4000:ms)}
let QS={head:'',known:{},sent:{},metaVer:'',metaSent:''};
try{QS=Object.assign(QS,JSON.parse(localStorage.getItem('sheraz-sync-qa')||'{}'))}catch(e){}
function saveQS(){try{localStorage.setItem('sheraz-sync-qa',JSON.stringify(QS))}catch(e){}}
function resetQS(){QS={head:'',known:{},sent:{},metaVer:'',metaSent:''};saveQS()}
const base2=()=>SY.url.trim().replace(/\/+$/,'')+'/eqa/'+encodeURIComponent(SY.code.trim()+'-v2');
const ckey=p=>p.area?'a_'+ek(p.area).replace(/[^A-Za-z0-9_%-]/g,'_'):'b_'+(Math.abs(strHash32(String(p.id)))%256);
function strHash32(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h}
const stamp=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function localChunks(){const m=new Map();for(const p of S.points){const k=ckey(p);let a=m.get(k);if(!a){a=[];m.set(k,a)}a.push(p)}return m}
function metaDoc(){const o=Object.assign({},S,{points:undefined,boq:Object.entries(S.boq||{}).map(([z,v])=>Object.assign({z},v)),sample:false});delete o.points;return o}
async function fget(u){const r=await fetch(u,{headers:{'X-Firebase-ETag':'true'},cache:'no-store'});if(r.status===401||r.status===403)throw new Error('Database rules block this sync code (see steps)');if(!r.ok)throw new Error('Server answered '+r.status);const txt=await r.text();let v=null;try{v=JSON.parse(txt)}catch(e){}return{v,tag:r.headers.get('ETag')||'',txt}}
async function fput(u,body,tag){const hd={'Content-Type':'application/json'};if(tag){hd['X-Firebase-ETag']='true';hd['if-match']=tag}const r=await fetch(u,{method:'PUT',headers:hd,body});if(r.status===412)return false;if(r.status===401||r.status===403)throw new Error('Database rules block writing (see steps)');if(!r.ok)throw new Error('Upload failed ('+r.status+')');await r.text();return true}
async function syncNow(manual){
  if(!syncOn()){showSyncState();return}
  if(!navigator.onLine){showSyncState();if(manual)toast('No internet — data will sync when you are online');return}
  if(syncing){syncAgain=true;return}
  syncing=true;setSync('Syncing…','--near');
  try{
    let done=false,merged=false;
    for(let a=0;a<5&&!done;a++){
      const H=await fget(base2()+'/head.json');const head=H.v&&H.v.chunks?H.v:null;
      if(head&&head.ver===QS.head&&!dirty){done=true;break}
      if(head&&head.ver!==QS.head){
        const need=Object.keys(head.chunks).filter(k=>head.chunks[k]!==QS.known[k]);
        const getMeta=head.meta&&head.meta!==QS.metaVer;
        if(need.length||getMeta){
          if(S.sample){S.points=[];S.wirs=[];S.checks=[];S.bounds=[];S.bms=[];S.boq={};S.piles=[];S.bmlog=[];S.photos=[];S.spots=[];S.anotes=[];S.del={w:{},p:{},l:{},s:{},g:{}};S.sample=false;S.metaUpd=0}
          const incoming={points:[]};let i=0;
          for(const k of need){i++;if(need.length>3)setSync(`Downloading ${i}/${need.length}…`,'--near');const c=await fget(base2()+'/c/'+k+'.json');if(Array.isArray(c.v))for(const p of c.v)if(p)incoming.points.push(p)}
          if(getMeta){const m=await fget(base2()+'/meta.json');if(m.v)Object.assign(incoming,m.v)}
          mergeIn(incoming);merged=true;
          if(!dirty){const LC=localChunks();need.forEach(k=>{QS.sent[k]=LC.has(k)?strHash(JSON.stringify(LC.get(k))):'empty'});if(getMeta)QS.metaSent=strHash(JSON.stringify(metaDoc()))}
          need.forEach(k=>{QS.known[k]=head.chunks[k]});if(getMeta)QS.metaVer=head.meta;persistNow();
        }
        QS.head=head.ver;saveQS();
      }
      if(!dirty&&head){done=true;break}
      if(S.sample&&!head){done=true;break}
      const L=localChunks(),chunks=Object.assign({},head?head.chunks:{});const ups=[];
      L.forEach((pts,k)=>{const txt=JSON.stringify(pts),h=strHash(txt);if(QS.sent[k]!==h||!chunks[k])ups.push([k,txt,h])});
      Object.keys(chunks).forEach(k=>{if(!L.has(k)&&QS.sent[k]!=='empty')ups.push([k,'[]','empty'])});
      const mtxt=JSON.stringify(metaDoc()),mh=strHash(mtxt);let meta=head?head.meta:'';
      let i=0;for(const[k,txt,h]of ups){i++;if(ups.length>3)setSync(`Uploading ${i}/${ups.length}…`,'--near');await fput(base2()+'/c/'+k+'.json',txt);const v=stamp();chunks[k]=v;QS.known[k]=v;QS.sent[k]=h}
      if(mh!==QS.metaSent||!meta){await fput(base2()+'/meta.json',mtxt);meta=stamp();QS.metaVer=meta;QS.metaSent=mh}
      const nv=stamp();const ok=await fput(base2()+'/head.json',JSON.stringify({ver:nv,meta,chunks,at:Date.now()}),H.tag);
      if(!ok){saveQS();continue}
      QS.head=nv;saveQS();setDirty(false);done=true;
    }
    if(!done)throw new Error('Another device is saving — try again');
    lastErr='';SY.last=Date.now();saveSY();syncPhotos();
    if(merged){view.init=false;brand();rerender()}
    if(manual)toast(merged?'Synced — new data received':'Synced — everything is up to date');
  }catch(e){lastErr=e.message||'Sync failed';if(manual)toast(lastErr)}
  finally{syncing=false;showSyncState();if(syncAgain){syncAgain=false;syncSoon(1500)}}
}
window.addEventListener('online',()=>syncNow());window.addEventListener('offline',showSyncState);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},45000);

  box.innerHTML=`<div class="card" style="margin-top:10px;padding:12px;box-shadow:none;background:var(--panel2)"><b>Link another device</b>
  <div class="small muted" style="margin-top:4px">Doosre device ke camera se yeh QR scan karein, ya link WhatsApp par bhej kar wahan kholein. Wahan dono apps (QA + Equipment) khud connect ho jayengi.</div>
  <div id="yQr" style="background:#fff;padding:10px;border-radius:10px;width:max-content;margin:10px auto"></div>
  <textarea readonly style="min-height:60px;font-size:11px">${esc(L)}</textarea><div class="row" style="margin-top:8px"><button class="btn acc sm" id="yLCp">Copy link</button></div>
  <div class="ur" style="margin-top:6px">Yeh link private rakhein — is se aap ka data khul sakta hai.</div></div>`;
  $('yLCp').onclick=()=>copy(L,'Link');
  try{if(window.QRCode)new QRCode($('yQr'),{text:L,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});else $('yQr').innerHTML='<span class="small" style="color:#333">QR needs internet once — use Copy link</span>'}catch(e){$('yQr').innerHTML='<span class="small" style="color:#333">Use Copy link</span>'}}
function takePair(){try{const q=new URLSearchParams(location.search).get('sync');if(!q)return false;const[u,c]=decodeURIComponent(escape(atob(q))).split('|');
  history.replaceState(null,'',location.href.split('?')[0]);if(!/^https:\/\/[^\s]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(u)||!c||c.length<20)return false;
  if(u===SY.url&&c===SY.code){toast('Already linked');return true}
  SY.url=u;SY.code=c;SY.etag='';SY.last=0;resetQS();saveSY();lastErr='';toast('Linked — syncing your data…');return true}catch(e){return false}}
function syncCard(){
  const on=syncOn();
  return `<div class="card" style="border-top:5px solid var(--fill)"><div class="ch"><h2>Auto sync</h2><small>${on?(lastErr?'<b style="color:var(--cut)">'+esc(lastErr)+'</b>':SY.last?'Last synced '+hhmm(SY.last)+' · '+dNice(new Date(SY.last).toISOString().slice(0,10)):'Not synced yet'):'Off'}</small></div>
    <div class="ur" style="margin-bottom:8px">Phone aur laptop dono par <b>same Database URL aur same Sync code</b> daalein. Internet ho to data khud aata jata rahega; offline entry net aate hi chali jayegi.</div>
    <div class="fgrid">

  <li>Left menu <b>Build → Realtime Database → Create Database</b> → location → <b>locked mode</b> → Enable</li>

  <li>Phir <b>Link phone / laptop</b> dabayein aur doosre device se QR scan karein</li></ol>
  <textarea readonly id="yRules" style="min-height:120px;font-size:11px">{\n  "rules": {\n    "eqa": {\n      "$code": {\n        ".read": "$code.length >= 20",\n        ".write": "$code.length >= 20"\n      }\n    }\n  }\n}</textarea>
  <button class="btn sm" id="yRulesCp" style="margin-top:6px">Copy rules</button></details>`}
  </div>`;
}
function bindSyncCard(){
  $('yNew').onclick=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=new Uint32Array(20);(crypto||window.msCrypto).getRandomValues(r);r.forEach(v=>s+=a[v%a.length]);$('yCode').value=s.replace(/(.{5})(?=.)/g,'$1-');toast('New code made — now tap Connect')};
